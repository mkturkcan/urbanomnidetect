# Ultralytics YOLO11-pose keypoints/pose estimation model with P2/4 - P6/64 outputs
# Model docs: https://docs.ultralytics.com/models/yolo11
# Task docs: https://docs.ultralytics.com/tasks/pose
# Parameters
nc: 3 # number of classes
kpt_shape: [8, 2] # number of keypoints, number of dims (2 for x,y or 3 for x,y,visible)
scales: # model compound scaling constants, i.e. 'model=yolo11n-pose.yaml' will call yolo11.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # summary: 196 layers, 2908507 parameters, 2908491 gradients, 7.7 GFLOPs
  s: [0.50, 0.50, 1024] # summary: 196 layers, 9948811 parameters, 9948795 gradients, 23.5 GFLOPs
  m: [0.50, 1.00, 512] # summary: 246 layers, 20973273 parameters, 20973257 gradients, 72.3 GFLOPs
  l: [1.00, 1.00, 512] # summary: 372 layers, 26230745 parameters, 26230729 gradients, 91.4 GFLOPs
  x: [1.00, 1.50, 512] # summary: 372 layers, 58889881 parameters, 58889865 gradients, 204.3 GFLOPs
# YOLO11n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10
  - [-1, 1, Conv, [1024, 3, 2]] # 11-P6/64
  - [-1, 2, C3k2, [1024, True]] # 12
# YOLO11n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 13
  - [[-1, 10], 1, Concat, [1]] # 14 cat backbone P5
  - [-1, 2, C3k2, [1024, False]] # 15
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 16
  - [[-1, 6], 1, Concat, [1]] # 17 cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 18
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 19
  - [[-1, 4], 1, Concat, [1]] # 20 cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 21 (P3/8-small)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 22
  - [[-1, 2], 1, Concat, [1]] # 23 cat backbone P2
  - [-1, 2, C3k2, [128, False]] # 24 (P2/4-xsmall)
  - [-1, 1, Conv, [256, 3, 2]] # 25
  - [[-1, 21], 1, Concat, [1]] # 26 cat head P3
  - [-1, 2, C3k2, [256, False]] # 27 (P3/8-small)
  - [-1, 1, Conv, [512, 3, 2]] # 28
  - [[-1, 18], 1, Concat, [1]] # 29 cat head P4
  - [-1, 2, C3k2, [512, False]] # 30 (P4/16-medium)
  - [-1, 1, Conv, [1024, 3, 2]] # 31
  - [[-1, 15], 1, Concat, [1]] # 32 cat head P5
  - [-1, 2, C3k2, [1024, True]] # 33 (P5/32-large)
  - [-1, 1, Conv, [1024, 3, 2]] # 34
  - [[-1, 12], 1, Concat, [1]] # 35 cat head P6
  - [-1, 2, C3k2, [1024, True]] # 36 (P6/64-xlarge)
  - [[24, 27, 30, 33, 36], 1, Pose, [nc, kpt_shape]] # Pose(P2, P3, P4, P5, P6)