# Ultralytics 🚀 AGPL-3.0 License - https://ultralytics.com/license
# Ultralytics YOLOv8-pose keypoints/pose estimation model with P2/4 - P6/64 outputs
# Model docs: https://docs.ultralytics.com/models/yolov8
# Task docs: https://docs.ultralytics.com/tasks/pose

# Parameters
nc: 3 # number of classes
kpt_shape: [8, 2] # number of keypoints, number of dims (2 for x,y or 3 for x,y,visible)
scales: # model compound scaling constants, i.e. 'model=yolov8n-p6.yaml' will call yolov8-p6.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

# YOLOv8.0x6 backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]] # 6
  - [-1, 1, Conv, [768, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [768, True]] # 8
  - [-1, 1, Conv, [1024, 3, 2]] # 9-P6/64
  - [-1, 3, C2f, [1024, True]] # 10
  - [-1, 1, SPPF, [1024, 5]] # 11

# YOLOv8.0x6 head with P2 support
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 12
  - [[-1, 8], 1, Concat, [1]] # 13 cat backbone P5
  - [-1, 3, C2, [768, False]] # 14
  
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 15
  - [[-1, 6], 1, Concat, [1]] # 16 cat backbone P4
  - [-1, 3, C2, [512, False]] # 17
  
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 18
  - [[-1, 4], 1, Concat, [1]] # 19 cat backbone P3
  - [-1, 3, C2, [256, False]] # 20
  
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 21
  - [[-1, 2], 1, Concat, [1]] # 22 cat backbone P2
  - [-1, 3, C2, [128, False]] # 23 (P2/4-tiny)
  
  - [-1, 1, Conv, [128, 3, 2]] # 24
  - [[-1, 20], 1, Concat, [1]] # 25 cat head P3
  - [-1, 3, C2, [256, False]] # 26 (P3/8-small)
  
  - [-1, 1, Conv, [256, 3, 2]] # 27
  - [[-1, 17], 1, Concat, [1]] # 28 cat head P4
  - [-1, 3, C2, [512, False]] # 29 (P4/16-medium)
  
  - [-1, 1, Conv, [512, 3, 2]] # 30
  - [[-1, 14], 1, Concat, [1]] # 31 cat head P5
  - [-1, 3, C2, [768, False]] # 32 (P5/32-large)
  
  - [-1, 1, Conv, [768, 3, 2]] # 33
  - [[-1, 11], 1, Concat, [1]] # 34 cat head P6
  - [-1, 3, C2, [1024, False]] # 35 (P6/64-xlarge)
  
  - [[23, 26, 29, 32, 35], 1, Pose, [nc, kpt_shape]] # 36 Pose(P2, P3, P4, P5, P6)