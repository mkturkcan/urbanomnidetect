- 8
- 3
# Horizontal-flip corner remap for the 8 cuboid corners (ground 0-3, top 4-7).
# A left-right image mirror is a reflection across the vehicle's length axis,
# which swaps 0<->3, 1<->2 (and 4<->7, 5<->6). Derived + verified three ways from
# the keypoint data (length axis = edges (0,1)&(2,3); 98% consistent ground
# winding; covariance + nearest-neighbour both pick this permutation). Setting
# flip_idx enables horizontal-flip augmentation, ~doubling effective pose data.
flip_idx: [3, 2, 1, 0, 7, 6, 5, 4]
